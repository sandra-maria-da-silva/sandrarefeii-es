<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandra Refeições</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-orange-50 min-h-screen">

<div class="max-w-7xl mx-auto p-5">

<!-- TOPO -->

<div class="bg-orange-600 text-white rounded-3xl p-8 text-center shadow-xl">

<h1 class="text-5xl font-black">
Sandra Refeições
</h1>

<p class="mt-2 text-lg">
Produção diária de almoço 🍛
</p>

</div>

<div class="grid lg:grid-cols-2 gap-8 mt-8">

<!-- CARDÁPIO -->

<div class="bg-white rounded-3xl shadow-xl p-6 h-fit">

<h2 class="text-3xl font-bold text-orange-600 mb-6">
Escolha seu almoço
</h2>

<!-- TIPO ALMOÇO -->

<div class="mb-5">

<label class="font-bold text-gray-700 block mb-2">
Tipo de almoço
</label>

<select
id="tipoAlmoco"
onchange="calcularTotal()"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
>

<option value="15">
Almoço R$ 15
</option>

<option value="18">
Almoço R$ 18
</option>

</select>

</div>

<!-- CARDÁPIO -->

<div
id="cardapio"
class="grid grid-cols-1 sm:grid-cols-2 gap-4"
></div>

</div>

<!-- CLIENTE -->

<div class="bg-white rounded-3xl shadow-xl p-6">

<h2 class="text-3xl font-bold text-orange-600 mb-6">
Dados do Cliente
</h2>

<div class="space-y-4">

<!-- NOME -->

<input
type="text"
id="nome"
placeholder="Nome do cliente"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
required
/>

<!-- TELEFONE -->

<input
type="tel"
id="telefone"
placeholder="Telefone"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
required
/>

<!-- ENTREGA -->

<select
id="tipoEntrega"
onchange="mostrarEndereco(); calcularTotal();"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
>

<option value="Entrega" selected>
Entrega
</option>

<option value="Retirada">
Retirada
</option>

</select>

<!-- ENDEREÇO -->

<div
id="boxEndereco"
class="w-full block"
>

<label class="block font-bold text-gray-700 mb-2 mt-2">
Endereço
</label>

<textarea
id="endereco"
rows="3"
placeholder="Digite o endereço completo"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
></textarea>

</div>

<!-- PAGAMENTO -->

<select
id="pagamento"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
>

<option>
Pix
</option>

<option>
Crédito
</option>

<option>
Débito
</option>

<option>
Dinheiro
</option>

</select>

<!-- TALHER -->

<select
id="garfo"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
>

<option value="Sim">
Talher: Sim
</option>

<option value="Não">
Talher: Não
</option>

</select>

<!-- OBSERVAÇÃO -->

<textarea
id="observacao"
rows="3"
placeholder="Observação do pedido"
class="w-full border-2 border-orange-200 rounded-2xl p-4"
></textarea>

<!-- RESUMO -->

<div class="bg-orange-50 border-2 border-orange-200 rounded-3xl p-5">

<h3 class="text-2xl font-bold text-orange-700 mb-4">
Resumo do Pedido
</h3>

<ul id="resumo" class="space-y-2"></ul>

<div class="mt-5 border-t pt-4">

<p class="text-lg">
Taxa de entrega:
<strong>
R$ 2,00
</strong>
</p>

<p class="text-lg">
Carne extra:
<strong>
+R$ 3,00 cada
</strong>
</p>

<p class="text-lg font-bold text-orange-700">

Valor do almoço:
R$
<span id="valorAlmoco">
15.00
</span>

</p>

<p class="text-3xl font-black text-orange-700 mt-3">

Total:
R$
<span id="total">
17.00
</span>

</p>

</div>

</div>

<!-- BOTÕES -->

<div class="grid md:grid-cols-2 gap-4">

<button
onclick="enviarPedido()"
class="bg-green-500 hover:bg-green-600 text-white font-bold p-5 rounded-2xl"
>

Enviar no WhatsApp

</button>

<button
onclick="window.print()"
class="bg-blue-500 hover:bg-blue-600 text-white font-bold p-5 rounded-2xl"
>

Imprimir Pedido

</button>

</div>

</div>

</div>

</div>

<script>

const carnes = [

"Frango na Chapa",
"Galinha Guisada",
"Bife ao Molho",
"Filé de Peixe",
"Fígado Acebolado",
"Bisteca com Barbecue"

];

const acompanhamentos = [

"Feijão Mulato",
"Feijão Macassar",
"Feijão Preto",
"Arroz",
"Macarrão",
"Legumes",
"Vinagrete",
"Purê de Batata Inglesa"

];

const carnesSelecionadas = [];
const acompanhamentosSelecionados = [];

const cardapio =
document.getElementById("cardapio");

const resumo =
document.getElementById("resumo");

function criarTitulo(texto){

const titulo =
document.createElement("div");

titulo.className =
"col-span-full text-xl font-bold text-orange-700 mt-4";

titulo.innerText = texto;

cardapio.appendChild(titulo);

}

criarTitulo("🍖 Carnes");

carnes.forEach(item => {

const botao =
document.createElement("button");

botao.innerText = item;

botao.className =
"border-2 border-orange-200 rounded-2xl p-4 font-semibold hover:bg-orange-100 transition";

botao.onclick = () => {

if(carnesSelecionadas.includes(item)){

carnesSelecionadas.splice(
carnesSelecionadas.indexOf(item),
1
);

botao.classList.remove(
"bg-orange-500",
"text-white"
);

}else{

carnesSelecionadas.push(item);

botao.classList.add(
"bg-orange-500",
"text-white"
);

}

atualizarResumo();
calcularTotal();

};

cardapio.appendChild(botao);

});

criarTitulo("🍛 Acompanhamentos");

acompanhamentos.forEach(item => {

const botao =
document.createElement("button");

botao.innerText = item;

botao.className =
"border-2 border-orange-200 rounded-2xl p-4 font-semibold hover:bg-orange-100 transition";

botao.onclick = () => {

if(acompanhamentosSelecionados.includes(item)){

acompanhamentosSelecionados.splice(
acompanhamentosSelecionados.indexOf(item),
1
);

botao.classList.remove(
"bg-orange-500",
"text-white"
);

}else{

acompanhamentosSelecionados.push(item);

botao.classList.add(
"bg-orange-500",
"text-white"
);

}

atualizarResumo();

};

cardapio.appendChild(botao);

});

function atualizarResumo(){

resumo.innerHTML = "";

carnesSelecionadas.forEach(item => {

const li =
document.createElement("li");

li.className =
"bg-white border rounded-xl p-3";

li.innerText =
"🍖 " + item;

resumo.appendChild(li);

});

acompanhamentosSelecionados.forEach(item => {

const li =
document.createElement("li");

li.className =
"bg-white border rounded-xl p-3";

li.innerText =
"🍛 " + item;

resumo.appendChild(li);

});

}

function mostrarEndereco(){

const tipo =
document.getElementById("tipoEntrega").value;

const boxEndereco =
document.getElementById("boxEndereco");

if(tipo === "Retirada"){

boxEndereco.style.display = "none";

}else{

boxEndereco.style.display = "block";

}

}

function calcularTotal(){

let valorAlmoco =
Number(
document.getElementById("tipoAlmoco").value
);

document.getElementById("valorAlmoco").innerHTML =
valorAlmoco.toFixed(2);

let total = valorAlmoco;

if(
document.getElementById("tipoEntrega").value
=== "Entrega"
){
total += 2;
}

if(carnesSelecionadas.length > 1){

total +=
(carnesSelecionadas.length - 1) * 3;

}

document.getElementById("total").innerHTML =
total.toFixed(2);

}

function enviarPedido(){

const nome =
document.getElementById("nome").value.trim();

const telefone =
document.getElementById("telefone").value.trim();

const endereco =
document.getElementById("endereco").value.trim();

const entrega =
document.getElementById("tipoEntrega").value;

const pagamento =
document.getElementById("pagamento").value;

const talher =
document.getElementById("garfo").value;

const observacao =
document.getElementById("observacao").value.trim();

const valorAlmoco =
document.getElementById("tipoAlmoco").value;

const total =
document.getElementById("total").innerText;

if(nome === "" || telefone === ""){

alert(
"Preencha nome e telefone"
);

return;

}

if(
entrega === "Entrega"
&& endereco === ""
){

alert(
"Digite o endereço completo"
);

return;

}

let mensagem =
`🍛 PEDIDO - SANDRA REFEIÇÕES\n\n`;

mensagem +=
`👤 Nome: ${nome}\n`;

mensagem +=
`📞 Telefone: ${telefone}\n`;

mensagem +=
`🍽️ Almoço: R$ ${valorAlmoco}\n`;

mensagem +=
`🚚 Tipo: ${entrega}\n`;

if(entrega === "Entrega"){

mensagem +=
`📍 Endereço: ${endereco}\n`;

mensagem +=
`🛵 Taxa entrega: R$ 2,00\n`;

}

mensagem +=
`💳 Pagamento: ${pagamento}\n`;

mensagem +=
`🍴 Talher: ${talher}\n`;

mensagem +=
`\n🍖 CARNES:\n`;

if(carnesSelecionadas.length === 0){

mensagem += "- Nenhuma selecionada\n";

}else{

carnesSelecionadas.forEach(item=>{

mensagem += `- ${item}\n`;

});

}

mensagem +=
`\n🍛 ACOMPANHAMENTOS:\n`;

if(acompanhamentosSelecionados.length === 0){

mensagem += "- Nenhum selecionado\n";

}else{

acompanhamentosSelecionados.forEach(item=>{

mensagem += `- ${item}\n`;

});

}

if(observacao !== ""){

mensagem +=
`\n📝 OBSERVAÇÃO:\n${observacao}\n`;

}

mensagem +=
`\n💰 TOTAL: R$ ${total}`;

const numero =
"5581985427194";

const url =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(url, "_blank");

}

calcularTotal();
mostrarEndereco();

</script>

</body>
</html>

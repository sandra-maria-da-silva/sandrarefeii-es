<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandra Refeições</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 p-5">

<div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-6">

<h1 class="text-4xl font-black text-center text-orange-600 mb-6">
Sandra Refeições 🍛
</h1>

<input
id="nome"
type="text"
placeholder="Nome"
class="w-full border-2 border-orange-200 p-4 rounded-2xl mb-4"
>

<input
id="telefone"
type="text"
placeholder="Telefone"
class="w-full border-2 border-orange-200 p-4 rounded-2xl mb-4"
>

<textarea
id="endereco"
placeholder="Endereço completo"
class="w-full border-2 border-orange-200 p-4 rounded-2xl mb-4"
></textarea>

<select
id="almoco"
class="w-full border-2 border-orange-200 p-4 rounded-2xl mb-4"
>

<option value="15">
Almoço R$ 15
</option>

<option value="18">
Almoço R$ 18
</option>

</select>

<h2 class="font-bold text-xl mb-3">
Carnes
</h2>

<div class="grid grid-cols-2 gap-3 mb-5">

<label><input type="checkbox" value="Frango na Chapa" class="carne"> Frango na Chapa</label>

<label><input type="checkbox" value="Galinha Guisada" class="carne"> Galinha Guisada</label>

<label><input type="checkbox" value="Bife ao Molho" class="carne"> Bife ao Molho</label>

<label><input type="checkbox" value="Filé de Peixe" class="carne"> Filé de Peixe</label>

<label><input type="checkbox" value="Fígado Acebolado" class="carne"> Fígado Acebolado</label>

<label><input type="checkbox" value="Bisteca com Barbecue" class="carne"> Bisteca com Barbecue</label>

</div>

<button
onclick="enviarPedido()"
class="w-full bg-green-500 hover:bg-green-600 text-white font-bold p-5 rounded-2xl"
>

Enviar Pedido

</button>

</div>

<script>

function enviarPedido(){

const nome =
document.getElementById("nome").value;

const telefone =
document.getElementById("telefone").value;

const endereco =
document.getElementById("endereco").value;

const almoco =
document.getElementById("almoco").value;

const carnes =
document.querySelectorAll(".carne:checked");

let listaCarnes = "";

carnes.forEach(item=>{

listaCarnes += "- " + item.value + "\\n";

});

let mensagem =
`🍛 PEDIDO - SANDRA REFEIÇÕES\n\n`;

mensagem +=
`👤 Nome: ${nome}\n`;

mensagem +=
`📞 Telefone: ${telefone}\n`;

mensagem +=
`📍 Endereço: ${endereco}\n`;

mensagem +=
`🍽️ Almoço: R$ ${almoco}\n\n`;

mensagem +=
`🍖 CARNES:\n${listaCarnes}`;

window.open(
`https://wa.me/5581985427194?text=${encodeURIComponent(mensagem)}`,
"_blank"
);

}

</script>

</body>
</html>
